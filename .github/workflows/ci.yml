name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  firmware:
    name: Firmware build (ESP-IDF)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.4
          target: esp32
          path: firmware

  firmware-tests:
    name: Firmware logic and driver tests (host, ASan + UBSan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: cmake -S firmware/components/telemetry/test -B build/telemetry-test
      - run: cmake --build build/telemetry-test
      - run: ./build/telemetry-test/telemetry_test
      - run: cmake -S firmware/components/onewire/test -B build/onewire-test
      - run: cmake --build build/onewire-test
      - run: ./build/onewire-test/onewire_test

  firmware-e2e:
    name: Firmware end to end (QEMU + ${{ matrix.broker }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # the same firmware and the same test against both brokers the repository ships a setup for
        broker: [Mosquitto, RabbitMQ]
    steps:
      - uses: actions/checkout@v5
      - name: Start Mosquitto with the repository's config and ACL
        if: matrix.broker == 'Mosquitto'
        run: |
          mkdir -p /tmp/mosquitto && cp mosquitto/mosquitto.conf mosquitto/acl /tmp/mosquitto/
          docker run --rm -v /tmp/mosquitto:/m eclipse-mosquitto:2 sh -c '
            touch /m/passwd &&
            mosquitto_passwd -b /m/passwd cm-qemu qemu-only &&
            mosquitto_passwd -b /m/passwd admin e2e-admin &&
            chmod 0700 /m/passwd /m/acl && chown 1883:1883 /m/passwd /m/acl'
          docker run -d --name broker -p 1884:1883 -v /tmp/mosquitto:/mosquitto/config eclipse-mosquitto:2
      - name: Start RabbitMQ with the repository's config and users
        if: matrix.broker == 'RabbitMQ'
        run: |
          docker run -d --name broker --hostname rabbitmq -p 1884:1883 \
            -e RABBITMQ_DEFAULT_USER=admin -e RABBITMQ_DEFAULT_PASS=e2e-admin \
            -v "$PWD/rabbitmq/rabbitmq.conf:/etc/rabbitmq/conf.d/90-cold-monitor.conf:ro" \
            -v "$PWD/rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro" rabbitmq:4.1-management
          # wait on the log: running rabbitmqctl as root before the server writes its Erlang cookie would create
          # the cookie with the wrong owner and stop the server from starting
          timeout 120 sh -c 'until docker logs broker 2>&1 | grep -q "Server startup complete"; do sleep 1; done'
          echo qemu-only | RABBITMQ_CONTAINER=broker ./rabbitmq/users.sh device cm-qemu
      # the device connects to 1883 on the host, where the test's proxy sits in front of the broker
      - name: Build the emulator firmware and run the test
        run: |
          docker run --rm --network host -v "$PWD:/repo" -w /repo/firmware espressif/idf:v5.4 bash -c '
            idf.py -B build-qemu -D SDKCONFIG=build-qemu/sdkconfig \
              -D SDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.qemu" build &&
            python3 test/qemu/e2e.py --broker-port 1884 --password e2e-admin --log build-qemu/qemu.log \
              -- idf.py -B build-qemu qemu'
      - name: Device serial log
        if: always()
        run: cat firmware/build-qemu/qemu.log || true
      - name: Broker log
        if: always()
        run: docker logs broker

  bridge:
    name: Bridge build and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bridge
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
          cache: maven
          cache-dependency-path: bridge/pom.xml
      # the MQTT tests start an embedded broker; the AMQP tests start RabbitMQ with Testcontainers, on the
      # runner's Docker
      - run: ./mvnw -B verify

  bridge-docker:
    name: Bridge Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: bridge
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
