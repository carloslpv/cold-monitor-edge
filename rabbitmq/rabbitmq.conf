# every client logs in with its own user (see users.sh); nobody gets in without a password
anonymous_login_user = none
loopback_users.guest = true

# MQTT clients land in the default vhost and publish to amq.topic: coldmonitor/cm-a1b2c3/readings becomes the
# routing key coldmonitor.cm-a1b2c3.readings, which the bridge's queue is bound to
mqtt.vhost = /
mqtt.exchange = amq.topic

log.console = true
log.console.level = info
log.file = false
