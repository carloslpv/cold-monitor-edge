listener 1883

# every client logs in, and the ACL limits each one to its own topics
allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl

# keep sessions and queued messages on disk, so a broker restart does not lose the backlog of the bridge
persistence true
persistence_location /mosquitto/data/
autosave_interval 60

# QoS 1 readings queued for the bridge while it or the backend is down: 100 probes at one reading per minute fill
# 100000 messages in about 16 hours. The default (1000) would start dropping after 10 minutes.
max_queued_messages 100000

log_dest stdout
log_type error
log_type warning
log_type notice
